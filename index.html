<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Key System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hareketli ve şık koyu arka plan efekti */
        .animated-bg {
            background: linear-gradient(-45deg, #09090b, #12121a, #050508, #181824);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glow-box { box-shadow: 0 0 40px rgba(0, 162, 255, 0.08); }
    </style>
</head>
<body class="animated-bg text-zinc-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Sol Üst Köşede Flex Logosu -->
    <div class="absolute top-6 left-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-blue-500 animate-ping"></div>
        <span class="font-black tracking-wider text-lg text-white">flex</span>
    </div>

    <!-- Sağ Üst Köşede Discord Butonu -->
    <div class="absolute top-6 right-6">
        <a href="https://discord.gg/VrwGw9Xhe" target="_blank" class="flex items-center gap-2 bg-[#5865F2]/10 hover:bg-[#5865F2]/20 border border-[#5865F2]/30 text-[#5865F2] hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition-all duration-200">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Discord
        </a>
    </div>

    <!-- Ana Konteyner (Ortalanmış) -->
    <div class="w-full max-w-md bg-[#111116]/90 backdrop-blur-xl border border-zinc-800/80 rounded-2xl p-6 md:p-8 glow-box shadow-2xl relative">
        
        <!-- Üst Dekoratif Çizgi -->
        <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-blue-500 to-transparent"></div>

        <!-- Başlık Bölümü -->
        <div class="text-center mb-8 mt-2">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white mb-1">
                FLEX KEY <span class="text-blue-500">SYSTEM</span>
            </h1>
            <p class="text-zinc-400 text-xs md:text-sm">
                Güvenli, hızlı ve tek tıkla çalışan 1 saatlik key sistemi.
            </p>
        </div>

        <!-- Orta Alan: Key Al Butonu -->
        <div class="space-y-6">
            <button id="getKeyBtn" onclick="getWorkingKey()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition-all duration-200 text-white font-bold py-4 px-4 rounded-xl text-sm shadow-lg shadow-blue-600/25 cursor-pointer flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
                Key Al / Get Key
            </button>
        </div>

        <!-- Sonuç / Key Gösterme Alanı (Başlangıçta Gizli) -->
        <div id="resultContainer" class="hidden mt-6 pt-6 border-t border-zinc-800/80 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Aktif Çalışan Key
                </span>
                <!-- Süre Bilgisi -->
                <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md font-mono">
                    Süre: 1 Saat
                </span>
            </div>

            <!-- Key Kutusu ve Kopyala Butonu -->
            <div class="flex items-center gap-2">
                <input type="text" id="generatedKeyBox" readonly class="w-full bg-[#181822] border border-zinc-700/60 rounded-xl px-4 py-3 text-xs font-mono text-blue-400 focus:outline-none select-all font-bold" />
                <button onclick="copyKey()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 transition-all text-zinc-200 px-4 py-3 rounded-xl text-xs font-semibold cursor-pointer shrink-0">
                    Kopyala
                </button>
            </div>
        </div>

        <!-- Alt Bilgi / Footer -->
        <div class="mt-8 pt-4 border-t border-zinc-800/50 flex items-center justify-between text-xs text-zinc-500">
            <span>Flex Engine v2.0</span>
            <span>Güvenli Doğrulama</span>
        </div>

    </div>

    <!-- JavaScript Mantığı (Webhook + Key Havuzu) -->
    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1560786895535996929/9OsT89Dd1-j64uxMF-Ylz6fAin3QiHfqGtg428KVITqPaucoSwqOI-6GrS7OhmPRK3CG";

        const workingKeys = [
            "FlexKey2026-Alpha",
            "FlexKey2026-Beta",
            "FlexKey2026-Gamma",
            "FlexKey2026-Delta",
            "FlexKey2026-Omega",
            "FlexKey2026-Prime",
            "FlexKey2026-Elite",
            "FlexKey2026-Master",
            "FlexKey2026-Turbo",
            "FlexKey2026-Ultimate"
        ];

        function getWorkingKey() {
            const btn = document.getElementById('getKeyBtn');
            const resultContainer = document.getElementById('resultContainer');
            const keyBox = document.getElementById('generatedKeyBox');

            btn.disabled = true;
            btn.innerHTML = "Key Seçiliyor...";

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * workingKeys.length);
                const selectedKey = workingKeys[randomIndex];

                keyBox.value = selectedKey;
                resultContainer.classList.remove('hidden');
                
                // Discord Webhook'a Bildirim Gönderme
                sendToDiscord(selectedKey);

                btn.disabled = false;
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                    Yeni Key Al / Get Key
                `;
            }, 500);
        }

        function sendToDiscord(key) {
            const now = new Date();
            const timeString = now.toLocaleDateString('tr-TR') + " " + now.toLocaleTimeString('tr-TR');

            const payload = {
                embeds: [{
                    title: "🔑 Yeni Key Alındı!",
                    color: 3447003, // Mavi renk
                    fields: [
                        { name: "Verilen Key:", value: `\`\`\`${key}\`\`\``, inline: false },
                        { name: "Alındığı Saat / Tarih:", value: `\`${timeString}\``, inline: false }
                    ],
                    footer: { text: "Flex Hub Key Logger System" }
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Webhook gönderilemedi:", err));
        }

        function copyKey() {
            const keyBox = document.getElementById('generatedKeyBox');
            keyBox.select();
            keyBox.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(keyBox.value);

            const copyBtn = event.target;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = "Kopyalandı!";
            copyBtn.classList.add('bg-emerald-600', 'text-white');
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.classList.remove('bg-emerald-600', 'text-white');
            }, 2000);
        }
    </script>
</body>
</html>
